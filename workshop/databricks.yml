# This is a Declarative Automation Bundle definition for workshop.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: workshop
  uuid: d2c62055-6943-4967-a521-99542d21d99e

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405613972875759.19.azuredatabricks.net
    variables:
      catalog: tabfm_and_tsfm
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405613972875759.19.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/marc.susagna@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/marc.susagna@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: tabfm_and_tsfm
      schema: prod
    permissions:
      - user_name: marc.susagna@databricks.com
        level: CAN_MANAGE
